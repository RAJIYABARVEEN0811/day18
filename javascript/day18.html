<!DOCTYPE html>
<html>
<body style="text-align:center;">
<h2>Task 1</h2>
<h3>Check Number</h3>
<input type="number" id="num">
<button onclick="checkNumber()">Check</button>
<p id="result1"></p>
<h3>Days of Week</h3>
<input type="number" id="day">
<button onclick="showDay()">Show Day</button>
<p id="result2"></p>
<script>
function checkNumber() {
  let n = document.getElementById("num").value;

  if (n > 0) {
    document.getElementById("result1").innerText = "Positive";
  } else if (n < 0) {
    document.getElementById("result1").innerText = "Negative";
  } else {
    document.getElementById("result1").innerText = "Zero";
  }
}
function showDay() {
  let d = document.getElementById("day").value;
  switch(d) {
    case "1": document.getElementById("result2").innerText = "Sunday"; break;
    case "2": document.getElementById("result2").innerText = "Monday"; break;
    case "3": document.getElementById("result2").innerText = "Tuesday"; break;
    case "4": document.getElementById("result2").innerText = "Wednesday"; break;
    case "5": document.getElementById("result2").innerText = "Thursday"; break;
    case "6": document.getElementById("result2").innerText = "Friday"; break;
    case "7": document.getElementById("result2").innerText = "Saturday"; break;
    default: document.getElementById("result2").innerText = "Invalid";
  }
}
</script>
</body>
</html>
